[package]
name = "gravity-anime"
version = "0.1.0"
description = "A modern Windows desktop anime streaming app"
authors = ["GravityAnime contributors"]
edition = "2021"

[lib]
name = "gravity_anime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "json"] }
scraper = "0.22"
urlencoding = "2"
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
