name: Release & Package Windows NSIS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Desktop App
        run: npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare and Rename Setup Executable
        id: prepare-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not found in release bundle."
          }
          $targetPath = Join-Path $installer.DirectoryName "GravityAnime-Setup.exe"
          Copy-Item -Path $installer.FullName -Destination $targetPath -Force
          Write-Host "Created target installer: $targetPath"
          echo "INSTALLER_PATH=$targetPath" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=GravityAnime-Setup.exe" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update update-info.json and commit to main
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FILE_NAME: ${{ env.INSTALLER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The tag checkout is a detached HEAD. Switch to the latest main
          # BEFORE reading the file so we never work from a stale/broken copy.
          git fetch origin main
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to check out main." }

          $version = $env:TAG_NAME.TrimStart('v')
          $jsonPath = "update-info.json"
          $today = (Get-Date).ToString("yyyy-MM-dd")
          $downloadUrl = "https://github.com/$env:REPO/releases/download/$env:TAG_NAME/$env:FILE_NAME"

          if (Test-Path $jsonPath) {
            try {
              $data = Get-Content $jsonPath -Raw | ConvertFrom-Json
            } catch {
              Write-Host "--- First 20 lines of $jsonPath ---"
              Get-Content $jsonPath | Select-Object -First 20
              throw "update-info.json is not valid JSON: $_"
            }
          } else {
            $data = [PSCustomObject]@{
              current_version       = $null
              all_previous_versions = @()
            }
          }

          # Archive the old current version, unless this is a re-run of the same release
          $previous = @($data.all_previous_versions)
          if ($data.current_version -and $data.current_version.version -ne $version) {
            $previous = @($data.current_version) + $previous
          }
          # Drop any stale entry for the version being released
          $previous = @($previous | Where-Object { $_.version -ne $version })

          $newData = [PSCustomObject]@{
            current_version = [PSCustomObject]@{
              version       = $version
              release_date  = $today
              notes         = "Release $env:TAG_NAME"
              download_url  = $downloadUrl
              installer_url = $downloadUrl
            }
            all_previous_versions = $previous
          }

          $jsonString = $newData | ConvertTo-Json -Depth 10
          # Validate before writing
          $null = $jsonString | ConvertFrom-Json
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD $jsonPath),
            $jsonString + "`n",
            (New-Object System.Text.UTF8Encoding $false)
          )

          git add $jsonPath
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): auto-update update-info.json for $env:TAG_NAME [skip ci]"
            git pull --rebase origin main
            git push origin main
            if ($LASTEXITCODE -ne 0) { throw "Failed to push to main." }
          } else {
            Write-Host "No changes to commit."
          }