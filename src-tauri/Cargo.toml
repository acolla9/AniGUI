[package]
name = "anicli-gui"
version = "0.1.2"
description = "A Windows-friendly desktop GUI for ani-cli"
authors = ["AniCLI GUI contributors"]
edition = "2021"

[lib]
name = "anicli_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
scraper = "0.22"
urlencoding = "2"
